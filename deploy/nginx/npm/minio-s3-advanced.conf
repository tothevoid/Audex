# Service: MinIO (S3 Storage API)

# Maximum payload size for binary object uploads in S3
client_max_body_size 500M;

# Disable request and response buffering for direct streaming uploads to MinIO
proxy_buffering off;
proxy_request_buffering off;
chunked_transfer_encoding on;

# Crucial for AWS Signature V4: Host header must strictly match the client-requested virtual host
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Extended transfer timeouts for multi-megabyte object uploads
proxy_connect_timeout 300s;
proxy_send_timeout 300s;
proxy_read_timeout 300s;
