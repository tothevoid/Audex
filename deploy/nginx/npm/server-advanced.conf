# Service: Audex Server (Web API & SignalR)

# Maximum allowed payload size for database backups and broker reports
client_max_body_size 100M;

# Extended timeouts for long-running operations and SignalR WebSocket lifetime
proxy_connect_timeout 300s;
proxy_send_timeout 3600s;
proxy_read_timeout 3600s;
send_timeout 3600s;

# Disable proxy buffering for Server-Sent Events (SSE) and streamed file exports
proxy_buffering off;
proxy_request_buffering off;
