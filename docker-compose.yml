services:
  database:
    image: postgres:17.4
    container_name: ${PROJECT_NAME}_database
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 5s
      retries: 10
    networks:
      - postgres-network
    ports:
      - ${POSTGRES_PORT}:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
  files-database:
    image: minio/minio
    container_name: ${PROJECT_NAME}_files-database
    restart: always
    ports:
      - ${MINIO_API_PORT}:9000
      - ${MINIO_UI_PORT}:9001
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - server-network
  infrastructure_manager:
    build: ./infra-manager
    container_name: ${PROJECT_NAME}_infrastructure_manager
    restart: always
    environment:
      - ASPNETCORE_HTTP_PORTS=${INFRA_MANAGER_PORT:-5050}
      - INFRA_MANAGER_AUTH_KEY=${INFRA_MANAGER_AUTH_KEY:-dev-infra-secret-key-321}
      - DB__ConnectionString=Host=database;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};
      - FileStorage__Endpoint=files-database
      - FileStorage__Port=9000
      - FileStorage__User=${MINIO_ROOT_USER}
      - FileStorage__Password=${MINIO_ROOT_PASSWORD}
      - FileStorage__UseSsl=false
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${INFRA_MANAGER_PORT:-5050}/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s
    depends_on:
      database:
        condition: service_healthy
      files-database:
        condition: service_healthy
    networks:
      - server-network
      - postgres-network
  server:
    build: ./server
    container_name: ${PROJECT_NAME}_server
    restart: always
    extra_hosts:
      - "${PUBLIC_MINIO_ENDPOINT}:host-gateway"
    ports:
      - ${SERVER_PORT}:5000
    environment:
      - ASPNETCORE_HTTP_PORTS=5000
      - DOTNET_ENVIRONMENT=Release
      - DB__ConnectionString=Host=database;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Pooling=true;MinPoolSize=2;MaxPoolSize=100;Keepalive=30;ConnectionIdleLifetime=300;TcpKeepAlive=true;Application Name=AudexApi;Enlist=false;Timeout=15;Command Timeout=30;
      - FileStorage__Endpoint=${PUBLIC_MINIO_ENDPOINT}
      - FileStorage__UseSsl=${MINIO_USE_SSL}
      - FileStorage__User=${MINIO_ROOT_USER}
      - FileStorage__Password=${MINIO_ROOT_PASSWORD}
      - FileStorage__Port=${MINIO_API_PORT}
      - InfrastructureManager__Url=http://infrastructure_manager:${INFRA_MANAGER_PORT:-5050}
      - InfrastructureManager__ApiKey=${INFRA_MANAGER_AUTH_KEY:-dev-infra-secret-key-321}
      - Client__Url=${PUBLIC_CLIENT_URL}
      - Auth__Audience=${PUBLIC_CLIENT_URL}
      - Auth__Issuer=${PUBLIC_SERVER_URL}
      - Auth__Secret=${AUTH_SECRET}
    volumes:
      - dataprotection_keys:/root/.aspnet/DataProtection-Keys
    depends_on:
      database:
        condition: service_healthy
      files-database:
        condition: service_healthy
      infrastructure_manager:
        condition: service_healthy
    networks:
      - server-network
      - postgres-network
  client:
    container_name: ${PROJECT_NAME}_client
    restart: always
    depends_on:
      - server
    networks:
      - server-network
    build: 
      context: ./client
      args:
        SERVER_API_URL: "${PUBLIC_SERVER_URL}"
        CLIENT_HOST: ${PUBLIC_CLIENT_URL}
    ports:
      - ${CLIENT_PORT}:80
networks:
  server-network:
  postgres-network:

volumes:
  postgres_data:
  minio_data:
  dataprotection_keys: